[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "okx-trader-gui"
version = "0.1.0"
description = "A staged PySide6 desktop application based on python-okx"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "python-okx>=0.4,<0.5",
    "httpx>=0.27,<1",
    "websockets>=13,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5"]
voice = ["piper-tts>=1.3,<2"]

[project.scripts]
okx-gui = "okx_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
